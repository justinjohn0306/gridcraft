<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>SheetCraft</title>
  <link data-trunk rel="rust" data-bin="sheetcraft-web" data-wasm-opt="z" data-weak-refs />
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #f3f3f3; }
    #sheetcraft_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #sheetcraft_loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #555; font: 14px system-ui, sans-serif; pointer-events: none; }
  </style>
</head>
<body>
  <canvas id="sheetcraft_canvas"></canvas>
  <div id="sheetcraft_loading">Loading SheetCraft&hellip;</div>
</body>
</html>
